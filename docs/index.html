<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hone — Email Confirmed</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a1a;
      color: #e8e0d5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #232323;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 420px;
      width: 90%;
      text-align: center;
    }
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 36px;
      height: 36px;
      background: #c8b89a;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .logo-name {
      font-size: 20px;
      font-weight: 700;
      color: #e8e0d5;
      letter-spacing: -0.3px;
    }
    .checkmark {
      width: 64px;
      height: 64px;
      background: rgba(139, 178, 120, 0.12);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 28px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #e8e0d5;
      margin-bottom: 12px;
      letter-spacing: -0.3px;
    }
    p {
      font-size: 14px;
      color: #9e9e9e;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .step {
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 10px;
      padding: 16px;
      text-align: left;
      font-size: 13px;
      color: #c8b89a;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .step-num {
      width: 24px;
      height: 24px;
      background: rgba(200, 184, 154, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">✏️</div>
      <span class="logo-name">Hone</span>
    </div>
    <div class="checkmark">✅</div>
    <h1>Email confirmed</h1>
    <p>Your Hone account is verified. Go back to the app and sign in with your email and password.</p>
    <div class="step">
      <div class="step-num">1</div>
      Open Hone from your menu bar, then go to Settings → Account and sign in.
    </div>
  </div>
</body>
</html>
